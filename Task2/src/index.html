<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="bg-slate-50">
<nav class="bg-white border-b border-gray-200">
    
    <div class="max-w-[1200px] mx-auto px-6 h-[72px] flex items-center justify-between gap-6">

        <!-- Logo -->
        <h1 class="text-xl font-bold text-blue-600">
            ShopKart
        </h1>

        <!-- Search -->
        <div class="hidden sm:flex flex-1 max-w-[500px]">
            <input
                type="text"
                placeholder="Search for products..."
                class="w-full border border-gray-200 rounded-lg px-4 py-2 text-sm outline-none"
            >
        </div>

        <!-- Icons -->
        <div class="flex items-center gap-5 text-gray-700">

            <span class="text-lg">
                🛒
            </span>

            <span class="text-lg">
                👤
            </span>

        </div>

    </div>

</nav>
<main class="max-w-[1200px] mx-auto px-6 py-8">

    <!-- Breadcrumb -->
    <div class="text-sm text-gray-500 mb-6">
        Home / Electronics
    </div>
    <!-- Mobile and Tablet Filters -->
<div class="lg:hidden flex items-center justify-between gap-3 mb-6">

    <button class="flex-1 border border-gray-200 bg-white rounded-lg px-4 py-2 text-sm">
        ☰ Filters
    </button>

    <select class="flex-1 border border-gray-200 bg-white rounded-lg px-4 py-2 text-sm">
        <option>Sort by</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Rating</option>
    </select>

</div>

    <!-- Main Layout -->
    <div class="flex gap-8">

        <!-- Sidebar -->
        <aside class="hidden lg:block w-[240px] shrink-0 bg-white border border-gray-200 rounded-xl p-5">

            <h2 class="text-base font-semibold text-gray-900">
                Filters
            </h2>

            <div class="mt-6">

                <h3 class="text-sm font-semibold text-gray-900">
                    Category
                </h3>

                <div class="mt-3 space-y-2 text-sm text-gray-600">

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Electronics
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Clothing
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Shoes
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Accessories
                    </label>

                </div>

            </div>

            <div class="mt-6">

                <h3 class="text-sm font-semibold text-gray-900">
                    Price
                </h3>

                <div class="mt-3 space-y-2 text-sm text-gray-600">

                    <label class="flex items-center gap-2">
                        <input type="radio" name="price">
                        Under $50
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="price">
                        $50 - $100
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="price">
                        $100 - $200
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="price">
                        Above $200
                    </label>

                </div>

            </div>

        </aside>


        <!-- Products Area -->
        <section class="flex-1">

            <div class="flex items-center justify-between mb-6">

                <div>
                    <h2 class="text-2xl font-bold text-gray-900">
                        Electronics
                    </h2>

                    <p class="text-sm text-gray-500 mt-1">
                        24 products
                    </p>
                </div>

                <select class="hidden lg:block border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    <option>Sort by</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Rating</option>
                </select>

            </div>

            <!-- Products will come here -->
<!-- Product Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

    <!-- Product 1 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col group">

        <div class="relative h-[220px] bg-gray-100 rounded-lg overflow-hidden">
            <span class="absolute top-3 left-3 bg-red-600 text-white text-xs px-2 py-1 rounded">
                SALE
            </span>

            <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                alt="Headphones"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            >
        </div>

        <p class="text-xs text-gray-500 mt-4">
            Electronics
        </p>

        <h3 class="text-base font-semibold text-gray-900 mt-1">
            Wireless Headphones
        </h3>

        <div class="flex items-center gap-1 mt-2 text-orange-400 text-sm">
            ★★★★★
            <span class="text-gray-500">(124)</span>
        </div>

        <div class="flex items-center gap-2 mt-3">
            <span class="text-xl font-bold text-gray-900">
                $59
            </span>

            <span class="text-sm text-gray-400 line-through">
                $79
            </span>
        </div>

        <button class="mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
            Add to Cart
        </button>

    </div>


    <!-- Product 2 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col group">

        <div class="relative h-[220px] bg-gray-100 rounded-lg overflow-hidden">
            <span class="absolute top-3 left-3 bg-blue-600 text-white text-xs px-2 py-1 rounded">
                NEW
            </span>

            <img
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                alt="Watch"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            >
        </div>

        <p class="text-xs text-gray-500 mt-4">
            Accessories
        </p>

        <h3 class="text-base font-semibold text-gray-900 mt-1">
            Classic Watch
        </h3>

        <div class="flex items-center gap-1 mt-2 text-orange-400 text-sm">
            ★★★★☆
            <span class="text-gray-500">(86)</span>
        </div>

        <div class="flex items-center gap-2 mt-3">
            <span class="text-xl font-bold text-gray-900">
                $89
            </span>

            <span class="text-sm text-gray-400 line-through">
                $110
            </span>
        </div>

        <button class="mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
            Add to Cart
        </button>

    </div>


    <!-- Product 3 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col group">

        <div class="relative h-[220px] bg-gray-100 rounded-lg overflow-hidden">

            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                alt="Shoes"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            >
        </div>

        <p class="text-xs text-gray-500 mt-4">
            Shoes
        </p>

        <h3 class="text-base font-semibold text-gray-900 mt-1">
            Running Shoes
        </h3>

        <div class="flex items-center gap-1 mt-2 text-orange-400 text-sm">
            ★★★★★
            <span class="text-gray-500">(210)</span>
        </div>

        <div class="flex items-center gap-2 mt-3">
            <span class="text-xl font-bold text-gray-900">
                $72
            </span>

            <span class="text-sm text-gray-400 line-through">
                $95
            </span>
        </div>

        <button class="mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
            Add to Cart
        </button>

    </div>


    <!-- Product 4 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col group">

        <div class="relative h-[220px] bg-gray-100 rounded-lg overflow-hidden">

            <img
                src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"
                alt="Camera"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            >
        </div>

        <p class="text-xs text-gray-500 mt-4">
            Electronics
        </p>

        <h3 class="text-base font-semibold text-gray-900 mt-1">
            Digital Camera
        </h3>

        <div class="flex items-center gap-1 mt-2 text-orange-400 text-sm">
            ★★★★☆
            <span class="text-gray-500">(74)</span>
        </div>

        <div class="flex items-center gap-2 mt-3">
            <span class="text-xl font-bold text-gray-900">
                $199
            </span>

            <span class="text-sm text-gray-400 line-through">
                $239
            </span>
        </div>

        <button class="mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
            Add to Cart
        </button>

    </div>

</div>
        </section>

    </div>

</main>
</body>
</html>
