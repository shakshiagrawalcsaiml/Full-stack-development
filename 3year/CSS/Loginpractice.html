<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <style>
        body{
            background:linear-gradient(to right,rgb(46, 20, 20),rgb(58, 27, 27));
              display:flex;
           justify-content: center;
            align-items:center;
           
             height:93vh;
        }
       
       
        button{
            background-color:rgb(72, 43, 43);
            color:white;
            height:35px;
            width:90%;
            border-radius:5px;
        }
        button:hover{
            background-color: rgb(49, 16, 16);
        }
        .container{
            border-radius:5px;
            background-color: rgb(255, 255, 255);
            width:38%;
            text-align:center;
            padding:20px;
        } 
        h2{
            font-size:30px;
           
        }
        input {
           border-radius:5px;
           width:93%;
           height:35px;
           border: 1px solid #ccc;
           box-sizing:border-box;
        }
        h3{
            text-align:start;
            margin-bottom:4px;
        }

    </style>
</head>
<body>
    <div class="container">
    
    <form>
        <h2>Login Page</h2>
    <h3>Username</h3>
    <input type="text" placeholder="Enter username"><br>
    <h3>password</h3>
    <input type="password" placeholder="Enter password">
    <br><br>
    <button type="submit">submit</button>
</form>
</div>
</body>
</html>
