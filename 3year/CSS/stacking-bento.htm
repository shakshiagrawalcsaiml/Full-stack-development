<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        :root{
            --primary-color:rgb(203, 74, 136);
            --text-size: 30px;
        }
        .container{
            background-color: var(--primary-color);
            display: grid;
            height: 500px;
            width: 500px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            outline:1px solid black;
        }
        .container>div{
            font-size: calc(var(--text-size)*2);
            outline:1px dashed black;
        }
        /* #box1{
            background-color: rgb(206, 22, 111);
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            z-index: 1;
        }
        #box6{
            background-color: rgb(83, 9, 45);
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            z-index: 2;
        } */
         .parent{
            --primary-color:rgb(136, 43, 88);
            display:grid;
            background-color:bisque;
            grid-template-columns:subgrid;
            grid-template-rows:subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
         }
         .child{
            background-color: var(--primary-color);
           color:white;
           grid-column: 2/3;
           grid-row: 2/3;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            1
            <div class="child">
                2
            </div>

        </div>
        </div>
</body>
</html>
